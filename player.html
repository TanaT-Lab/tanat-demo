<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanaT Demo Player</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <!-- Critical CSS to prevent flash - only for initial load -->
    <style>
        body { background-color: #0d1117; margin: 0; }
        .sidebar, .main-header, .main-content,
        .intro-screen { display: none; }
        .mobile-pipeline-header { display: none; }
        .transition-screen { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0d1117; display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .transition-actions { display: none; }
        .global-nav-controls { display: none; }
        .progress-bar-container { display: none; }
    </style>
    <link rel="stylesheet" href="core/styles.css">
</head>
<body class="layout-transition">
    
    <audio id="demo-audio" preload="auto"></audio>
    
    <!-- ═══════════════════════════════════════════════════════════════════════
         INTRO SCREEN
         ═══════════════════════════════════════════════════════════════════════ -->
    <div id="intro-screen" class="intro-screen" style="display: none;">
        <div class="intro-content">
            <!-- Notepad-style notes container -->
            <div class="intro-notepad-container">
                <div id="intro-notepad" class="intro-notepad"></div>
            </div>
            
            <!-- Visualizations will be injected here by the player -->
            <div id="intro-visualizations"></div>
        </div>
    </div>
    
    <!-- ═══════════════════════════════════════════════════════════════════════
         TRANSITION SCREEN - Logo spinner between landing and intro
         ═══════════════════════════════════════════════════════════════════════ -->
    <div id="transition-screen" class="transition-screen">
        <div class="transition-content">
            <h1 id="transition-title" class="transition-title">Loading...</h1>
            <div class="transition-logo">
                <img src="assets/logo.png" alt="" class="transition-logo-img">
            </div>
            <p id="transition-text" class="transition-text">Preparing demo...</p>
            <div id="transition-actions" class="transition-actions">
                <button id="transition-back-btn" class="transition-btn back">← Back to demos</button>
                <button id="transition-start-btn" class="transition-btn start">Ready to start ▶</button>
            </div>
        </div>
    </div>
    
    <!-- ═══════════════════════════════════════════════════════════════════════
         CODE DEMO LAYOUT
         ═══════════════════════════════════════════════════════════════════════ -->
    
    <!-- Mobile Pipeline Header (shown only on mobile) -->
    <div class="mobile-pipeline-header" id="mobile-pipeline-header">
        <div class="mobile-pipeline-brand">
            <div class="mobile-pipeline-logo-wrap">
                <img src="assets/logo.png" alt="" class="mobile-pipeline-logo">
            </div>
            <span class="mobile-pipeline-title" id="mobile-demo-title">Demo</span>
        </div>
        <div class="mobile-pipeline-steps" id="mobile-pipeline-steps">
            <!-- Steps generated dynamically -->
        </div>
    </div>
    
    <!-- Mobile Explore More Header (shown in full-script view on mobile) -->
    <div class="mobile-explore-header" id="mobile-explore-header">
        <div class="mobile-explore-brand">
            <div class="mobile-explore-logo-wrap">
                <img src="assets/logo.png" alt="" class="mobile-explore-logo">
            </div>
            <span class="mobile-explore-title">TanaT</span>
        </div>
        <div class="mobile-explore-links">
            <a href="https://tanat-lab.github.io/TanaT/" target="_blank" class="mobile-explore-link">Docs</a>
            <a href="https://github.com/TanaT-Lab/TanaT" target="_blank" class="mobile-explore-link">GitHub</a>
        </div>
    </div>
    
    <!-- Sidebar -->
    <aside class="sidebar" style="display: none;">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <img src="assets/logo.png" alt="" class="sidebar-logo-img">
            </div>
            <h1 class="sidebar-title">TanaT</h1>
            <p class="sidebar-tagline">TEMPORAL ANALYSIS OF TRAJECTORIES</p>
        </div>
        
        <hr>
        
        <!-- Pipeline section (hidden in full-script view) -->
        <div class="sidebar-pipeline-section" id="sidebar-pipeline-section">
            <p class="section-label">PIPELINE</p>
            <div class="pipeline" id="pipeline-container">
                <!-- Pipeline stations will be generated dynamically -->
            </div>
        </div>
        
        <!-- Explore section (shown in full-script view) -->
        <div class="sidebar-explore-section" id="sidebar-explore-section" style="display: none;">
            <p class="section-label">EXPLORE MORE</p>
            <div class="sidebar-explore-links">
                <a href="https://tanat-lab.github.io/TanaT/" target="_blank" class="sidebar-explore-link">
                    Documentation
                </a>
                <a href="https://github.com/TanaT-Lab/TanaT" target="_blank" class="sidebar-explore-link">
                    GitHub Repository
                </a>
                <a href="index.html" class="sidebar-explore-link back-link">
                    ← Back to Demos
                </a>
            </div>
        </div>
    </aside>
    
    <!-- Header -->
    <header class="main-header" style="display: none;">
        <div class="header-titles">
            <h1 id="header-title">Demo Title</h1>
            <h2 id="header-subtitle">Demo Subtitle</h2>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="main-content" style="display: none;">
        <div id="stations-container">
            <!-- Stations will be generated dynamically -->
        </div>
        
        <div id="spacer" class="spacer"></div>
    </main>
    
    <!-- Narration progress bar: 3px, full width of the main column, just under
         the header (and at the very top of the screen in the intro layout).
         Its width tracks audioElement.currentTime / duration via timeupdate. -->
    <div id="progress-bar-container" class="progress-bar-container">
        <div id="progress-bar" class="progress-bar"></div>
    </div>
    
    <!-- Global Navigation Controls. On desktop these sit in the (fixed) header,
         right-aligned; in the intro layout (no header) they float top-right;
         on mobile they become the sticky footer. -->
    <div id="global-nav-controls" class="global-nav-controls" style="display: none;">
        <button id="global-back-btn" class="global-nav-btn back" title="Exit" aria-label="Exit">
            <svg viewBox="0 0 16 16" class="nav-icon" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
            <span class="nav-label">Exit</span>
        </button>
        <button id="global-prev-btn" class="global-nav-btn" disabled title="Previous (Left arrow)" aria-label="Previous (Left arrow)">
            <svg viewBox="0 0 16 16" class="nav-icon" aria-hidden="true"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="nav-label">Prev</span>
        </button>
        <button id="global-pause-btn" class="global-nav-btn pause" title="Pause / Resume (Space)" aria-label="Pause / Resume (Space)">
            <svg viewBox="0 0 16 16" class="nav-icon pause-icon" aria-hidden="true"><path d="M5 3v10M11 3v10" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
            <svg viewBox="0 0 16 16" class="nav-icon play-icon" aria-hidden="true" style="display:none;"><path d="M5 3l8 5-8 5z" fill="currentColor"/></svg>
            <span class="nav-label">Pause</span>
        </button>
        <button id="global-next-btn" class="global-nav-btn" title="Next (Right arrow)" aria-label="Next (Right arrow)">
            <span class="nav-label">Next</span>
            <svg viewBox="0 0 16 16" class="nav-icon" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="global-skip-btn" class="global-nav-btn reveal" title="Reveal (R)" aria-label="Reveal (R)">
            <svg viewBox="0 0 16 16" class="nav-icon" aria-hidden="true"><path d="M1 8s2.5-4.5 7-4.5S15 8 15 8s-2.5 4.5-7 4.5S1 8 1 8z" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg>
            <span class="nav-label">Reveal</span>
        </button>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    
    <!-- Demo config will be loaded dynamically -->
    <script id="demo-config-script"></script>
    <script src="core/player.js"></script>
</body>
</html>
